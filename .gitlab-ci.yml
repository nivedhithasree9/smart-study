---
stages:
  - prepare
  - quality
  - verification
  - security
  - compliance
  - smoke

default:
  tags:
    - smart-study
  before_script:
    - '& $env:PYTHON --version'
    - '& $env:PYTHON -m pip install -r requirements.txt -r requirements-dev.txt'

variables:
  PYTHON: 'C:\Users\HP\AppData\Local\Programs\Python\Python313\python.exe'

format:black:
  stage: quality
  script:
    - '& $env:PYTHON -m black --check .'

lint:ruff:
  stage: quality
  script:
    - '& $env:PYTHON -m ruff check .'

type:mypy:
  stage: verification
  script:
    - '& $env:PYTHON -m mypy app.py database.py services tests'

test:pytest:
  stage: verification
  script:
    - '& $env:PYTHON -m pytest -q'

security:bandit:
  stage: security
  script:
    - '& $env:PYTHON -m bandit -q -r app.py database.py services'

security:pip-audit:
  stage: security
  script:
    - '& $env:PYTHON -m pip_audit -r requirements.txt'

security:secrets:
  stage: security
  script:
    - >
      & $env:PYTHON -m detect_secrets scan --all-files
      --exclude-files
      ".+_cache[\\/].*|database[\\/].*|uploads[\\/].*|models[\\/].*"

syntax:compile:
  stage: prepare
  script:
    - '& $env:PYTHON -m compileall -q app.py database.py services tests scripts'

yaml:lint:
  stage: prepare
  script:
    - '& $env:PYTHON -m yamllint .gitlab-ci.yml .pre-commit-config.yaml'

metadata:license:
  stage: compliance
  script:
    - '& $env:PYTHON scripts/check_metadata.py'

policy:no-cloud:
  stage: compliance
  script:
    - '& $env:PYTHON scripts/check_no_cloud.py'

commits:semantic:
  stage: compliance
  script:
    - '& $env:PYTHON scripts/check_semantic_commit.py'

smoke:streamlit-import:
  stage: smoke
  script:
    - '& $env:PYTHON -c "import app; print(''streamlit app import ok'')"'
