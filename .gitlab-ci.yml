stages:
  - format
  - lint
  - type
  - test
  - security-bandit
  - security-pip-audit
  - security-secrets
  - syntax
  - yaml
  - metadata
  - policy
  - smoke

default:
  image: python:3.11-slim
  before_script:
    - python --version
    - pip install -r requirements.txt -r requirements-dev.txt

format:black:
  stage: format
  script:
    - black --check .

lint:ruff:
  stage: lint
  script:
    - ruff check .

type:mypy:
  stage: type
  script:
    - mypy app.py database.py services tests

test:pytest:
  stage: test
  script:
    - pytest -q

security:bandit:
  stage: security-bandit
  script:
    - bandit -q -r app.py database.py services

security:pip-audit:
  stage: security-pip-audit
  script:
    - pip-audit -r requirements.txt

security:secrets:
  stage: security-secrets
  script:
    - detect-secrets scan --all-files --exclude-files 'database/.*|uploads/.*|models/.*'

syntax:compile:
  stage: syntax
  script:
    - python -m py_compile app.py database.py services/*.py tests/*.py

yaml:lint:
  stage: yaml
  script:
    - yamllint .gitlab-ci.yml .pre-commit-config.yaml

metadata:license:
  stage: metadata
  script:
    - python scripts/check_metadata.py

policy:no-cloud:
  stage: policy
  script:
    - python scripts/check_no_cloud.py

smoke:streamlit-import:
  stage: smoke
  script:
    - python -c "import app; print('streamlit app import ok')"
