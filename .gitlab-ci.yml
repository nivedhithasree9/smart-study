---
stages:
  - prepare
  - quality
  - verification
  - security
  - compliance
  - smoke

default:
  image: python:3.11-slim
  tags:
    - smart-study
  before_script:
    - python --version
    - pip install -r requirements.txt -r requirements-dev.txt

format:black:
  stage: quality
  script:
    - black --check .

lint:ruff:
  stage: quality
  script:
    - ruff check .

type:mypy:
  stage: verification
  script:
    - mypy app.py database.py services tests

test:pytest:
  stage: verification
  script:
    - pytest -q

security:bandit:
  stage: security
  script:
    - bandit -q -r app.py database.py services

security:pip-audit:
  stage: security
  script:
    - pip-audit -r requirements.txt

security:secrets:
  stage: security
  script:
    - >
      detect-secrets scan --all-files
      --exclude-files
      ".+_cache[\\/].*|database[\\/].*|uploads[\\/].*|models[\\/].*"

syntax:compile:
  stage: prepare
  script:
    - python -m compileall -q app.py database.py services tests scripts

yaml:lint:
  stage: prepare
  script:
    - yamllint .gitlab-ci.yml .pre-commit-config.yaml

metadata:license:
  stage: compliance
  script:
    - python scripts/check_metadata.py

policy:no-cloud:
  stage: compliance
  script:
    - python scripts/check_no_cloud.py

commits:semantic:
  stage: compliance
  script:
    - python scripts/check_semantic_commit.py

smoke:streamlit-import:
  stage: smoke
  script:
    - python -c "import app; print('streamlit app import ok')"
